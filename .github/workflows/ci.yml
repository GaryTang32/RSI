name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[science,dev]"
      - run: python -m pytest -q   # offline and deterministic; the `live` marker is deselected by default

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.9"
      - run: ruff check rsi tests experiments scripts docs/skill-claims   # rules in pyproject.toml [tool.ruff]
      - run: ruff format --check rsi tests experiments scripts docs/skill-claims

  package:
    name: build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Every data file under rsi/ is in the wheel
        run: python scripts/check_package.py dist/*.whl
      - name: Install the wheel into a clean venv and run a loop outside the repo
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/python -I -c "from rsi.domains.agentqa import AgentQADomain; AgentQADomain().seed_artifact(); from rsi.domains.bbeh import load_manifest; load_manifest()"
          /tmp/venv/bin/rsi improve --method rrsi --problem agentqa --llm sim --out /tmp/run-sim

  skill-claims:
    name: skill claim ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python docs/skill-claims/check.py   # code, repo-doc and skill-ref rows; paper rows need the corpus
