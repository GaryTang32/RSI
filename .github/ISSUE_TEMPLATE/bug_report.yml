name: Bug report
description: Something in the rsi package, the skill or the docs does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest command or script that shows the problem. An offline run (`--llm sim`) is best if it reproduces.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      render: text
  - type: dropdown
    id: method
    attributes:
      label: Method
      options: [not method-specific, RRSI, GEPA, autoresearch, Meta-Harness, SoL-Pi, Dream-RSI, EvoMap, Harness²]
  - type: dropdown
    id: llm
    attributes:
      label: Model backend
      options: [offline simulator (sim), claude CLI (claude:<model>), Anthropic API (api:<model>), mock / tests only]
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`rsi` version or commit, Python version, OS."
      placeholder: "rsi 0.1.2 (or commit abc1234), Python 3.12, Ubuntu 24.04"
    validations:
      required: true
