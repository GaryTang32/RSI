[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi"
version = "0.1.0"
description = "Recursive Self-Improvement toolkit: autoresearch, RRSI, Dream-RSI, EvoMap, GEPA, Meta-Harness and SoL-Pi mechanisms on one shared propose-measure-keep core."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
science = ["scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]
api = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
include = ["rsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a real LLM backend (claude CLI or API key); skipped by default",
    "slow: takes more than a few seconds",
]
addopts = "-m 'not live'"
