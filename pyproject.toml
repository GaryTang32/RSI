[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi"
version = "0.1.2"
description = "Recursive Self-Improvement Agent Skills: eight RSI papers (RRSI, GEPA, autoresearch, Meta-Harness, SoL-Pi, Dream-RSI, EvoMap, Harness²) turned into tested code and agent skills on one guarded propose-measure-keep loop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
authors = [{ name = "GaryTang32" }]
keywords = ["recursive self-improvement", "prompt optimization", "agent harness", "llm", "claude", "claude code",
            "agent skills", "gepa", "autoresearch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/GaryTang32/RSI"
Source = "https://github.com/GaryTang32/RSI"
Issues = "https://github.com/GaryTang32/RSI/issues"
Changelog = "https://github.com/GaryTang32/RSI/blob/main/CHANGELOG.md"

[project.optional-dependencies]
science = ["scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]
api = ["anthropic>=0.40"]
dev = ["pytest>=7"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
include = ["rsi*"]

[tool.setuptools.package-data]
# seed-harness prompts, benchmark manifests and EvoMap's schemas: a non-editable install needs them too
"*" = ["*.json", "*.md", "NOTICE-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a real LLM backend (claude CLI or API key); skipped by default",
    "slow: takes more than a few seconds",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "docs/skill-claims/corpus",
    # source files the package uses as artifacts (shown to models, hashed, diffed against): keep them byte-stable
    "rsi/dream/policy_templates",
    "rsi/dream/policy_api.py",
    "rsi/domains/*/seed_harness",
    "rsi/domains/tinylm/prepare.py",
    "rsi/domains/tinylm/train.py",
    "rsi/domains/tabular/prepare.py",
    "rsi/domains/tabular/train.py",
    "rsi/autoresearch/landscape_prepare.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length: the formatter wraps code; long strings, URLs and tables stay readable as they are
    "E731",  # small named lambdas are used deliberately as local helpers
    "E741",  # single-letter names such as l follow the papers' notation in numeric code
    "B023",  # closures here are called inside the same loop iteration (checked), not deferred
    "B905",  # zip(): equal lengths are guaranteed by construction; strict= would only add noise
    "UP031", # %-formatting is kept where it builds code or templates that contain braces
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["rsi.solpi.gate.GateSpec", "rsi.solpi.GateSpec"]  # frozen dataclass: safe as a default

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
